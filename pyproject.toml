[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radiocli"
version = "1.0.0"
description = "radioCLI — a webradio player for the terminal, with an animated spectrum visualizer"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "mist3r_n0b0dy" }]
keywords = ["radio", "webradio", "terminal", "visualizer", "curses", "cli", "TUI"]
classifiers = [
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = []

[project.optional-dependencies]
dev = []

[project.scripts]
radiocli = "radiocli.app:main"

[project.urls]
Repository = "https://github.com/Mist3r-N0b0dy/radioCLI"
Homepage = "https://github.com/Mist3r-N0b0dy/radioCLI"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["radiocli*"]
